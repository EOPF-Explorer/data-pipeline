version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        # eopf-geozarr gets its own PR: its upgrades change conversion output
        # and need PINNED_EOPF_GEOZARR_VERSION in scripts/s1_store_meta.py
        # bumped with them, which would block the rest of the group.
        exclude-patterns:
          - "eopf-geozarr"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/docker"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/docker"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security:
        applies-to: security-updates
        patterns:
          - "*"
