name: Release Please

on:
  push:
    branches:
      - main

# Do NOT cancel in progress. These runs are ~20 s and idempotent, and cancelling
# one loses work that nothing re-does: a cancelled run that had already created
# the release tag takes docker-build with it, and the next run sees
# release_created=false because the release now exists -- so the image is never
# published. The same cancellation is what used to strand the release PR's
# uv.lock (the run that wrote the branch was killed; the survivor saw an
# unchanged PR and did nothing).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # Merge release PRs, create tags/commits for releases.
      pull-requests: write # Open/update Release Please version bump PRs.
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # release-please-config.json stamps the new version into BOTH pyproject.toml
      # and uv.lock, so the release PR carries a lock that `uv sync --locked`
      # accepts with no follow-up commit. The uv.lock jsonpath matches on
      # `@.name.value`, not `@.name`: release-please runs JSONPath over a
      # position-tagged TOML parse where every scalar is {start, end, value}
      # (googleapis/release-please#2455). If a release PR ever goes red on
      # `uv sync --locked` again, this run's log will say "No entries modified in
      # $.package[...]" and that jsonpath is what needs revisiting.
      - uses:  googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: "release-please-config.json"
          manifest-file: ".release-please-manifest.json"

  docker-build:
    name: Docker image after release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read # Token scope for invoking the reusable build workflow.
      actions: write # Same scope as build job for Docker Buildx GHA cache.
      security-events: write # Allow Trivy SARIF upload from reusable build workflow.
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      OVH_HARBOR_REGISTRY: ${{ secrets.OVH_HARBOR_REGISTRY }}
      OVH_HARBOR_USERNAME: ${{ secrets.OVH_HARBOR_USERNAME }}
      OVH_HARBOR_PASSWORD: ${{ secrets.OVH_HARBOR_PASSWORD }}
