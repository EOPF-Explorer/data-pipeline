name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: Pre-commit and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout repository.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.17"
      # --locked fails on a uv.lock that disagrees with pyproject.toml instead
      # of silently regenerating it, which previously let version drift reach
      # main unnoticed and surface as a dirty lock on every local commit.
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Set up pre-commit cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3.13-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          SKIP: pytest # Tests run explicitly below for verbose CI output.
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run --group test pytest tests/ -v --tb=short
