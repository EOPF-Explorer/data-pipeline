# One-off Argo Workflow: in-place S1 RTC legacy→datamodel cube migration (plan Task 4).
#
# Runs scripts/migrate_s1_rtc_datamodel.py against the staging cube collection in one container (no
# fan-out — 104 small-ish stores, driver loops internally with per-store continue-on-error). The cube
# bucket is owned by the eopfexplorer account; creds come from the in-cluster `geozarr-s3-credentials`
# SealedSecret (NO literals here), endpoint is OVH `de`.
#
# Usage (the s1rtc cron MUST be suspended first — C2 concurrency):
#   1. DRY-RUN (default, writes nothing):
#        argo submit -n devseed-staging deploy/migrate-s1-rtc-datamodel-workflow.yaml \
#          -p pipeline_image_version=<RC-tag>
#   2. REAL run (only after the dry-run looks right):
#        argo submit -n devseed-staging deploy/migrate-s1-rtc-datamodel-workflow.yaml \
#          -p pipeline_image_version=<RC-tag> -p dry_run=false
#      The driver's pre-flight refuses a real run unless the bucket has S3 versioning OR a
#      `backup_prefix` is given (C2 rollback safety).
#   3. ROLLBACK (only if a backup_prefix was used): -p rollback=true -p backup_prefix=<s3://…>
#
# pipeline_image_version MUST contain scripts/migrate_s1_rtc_datamodel.py AND the eopf-geozarr
# v0.11.0 pin (verify: `docker run --rm <image> python /app/scripts/migrate_s1_rtc_datamodel.py
# --help`). That means v1.17.1 or later; every tag before it predates #413.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: migrate-s1-rtc-datamodel-
  namespace: devseed-staging
spec:
  serviceAccountName: operate-workflow-sa
  entrypoint: migrate
  # Success cleaned after a day; failures kept 3 days for debugging.
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 259200
  arguments:
    parameters:
    # `v1.17.1` is the first release containing #413 (the eopf-geozarr v0.11.0 pin, the writer
    # behavioural probe, the stable completion marker and `--rewrite-root-geo`). Release tags are
    # immutable and are published by the tag build (`type=ref,event=tag`), which is what a run
    # against production cubes needs — the bucket has S3 versioning OFF, so a run on an image other
    # than the one the dry run validated is not recoverable.
    #
    # It replaces `pr-413`, used for the 2026-09-18 dry runs. A `pr-<N>` tag FOLLOWS THE PR HEAD, so
    # it is fine for a dry run and never acceptable for a write. So are `latest` and `main`, both of
    # which the main-branch build republishes on every merge. The template enforces this rather than
    # trusting the comment: anything that is not a `v*` release tag or an immutable `sha-*` tag exits
    # 1 when dry_run=false, before the driver starts.
    - name: pipeline_image_version          # REQUIRED — build containing migrate_s1_rtc_datamodel.py
      value: v1.17.1
    - name: stac_api_url
      value: https://api.explorer.eopf.copernicus.eu/stac
    - name: cube_collection
      value: sentinel-1-grd-rtc-staging
    - name: bucket                          # cube bucket — for the S3-versioning pre-flight
      value: esa-zarr-sentinel-explorer-fra
    - name: s3_endpoint
      value: https://s3.de.io.cloud.ovh.net
    - name: dry_run                         # SAFE DEFAULT: report only, write nothing
      value: "true"
    - name: backup_prefix                   # optional s3:// prefix (no-versioning fallback / rollback)
      value: ""
    - name: skip_tiles                      # optional, space-separated tile substrings
      value: ""
    - name: item                            # optional single item id, e.g. s1-rtc-30TUM (control tile)
      value: ""
    - name: rollback                        # "true" → restore every store from backup_prefix
      value: "false"
    - name: allow_no_backup                 # "true" → real run with NO backup (recovery = re-ingest)
      value: "false"
    - name: rewrite_root_geo                # "true" → ALSO rewrite each store's root geo metadata
      value: "false"                        # SAFE DEFAULT: re-derive vv/vh + consolidate, nothing else
  templates:
  - name: migrate
    activeDeadlineSeconds: 21600            # 6h ceiling for the whole fleet
    nodeSelector:
      nodepool: pipeline
    tolerations:
    - key: nodepool
      operator: Equal
      value: pipeline
      effect: NoSchedule
    script:
      image: w9mllyot.c1.de1.container-registry.ovh.net/eopf-sentinel-zarr-explorer/data-pipeline:{{workflow.parameters.pipeline_image_version}}
      imagePullPolicy: Always
      # Args assembled in a bash array from env (no param interpolated into the shell → no injection).
      command: [bash]
      source: |
        set -uo pipefail
        # A real run must be reproducible, so it may only use an IMMUTABLE tag: a `v*` release tag
        # or a `sha-*` commit tag. Everything else -- `pr-<N>` (follows the PR head), `latest` and
        # `main` (republished on every merge), a branch name -- is refused unless this is a dry run.
        # An allowlist, not a denylist: a new mutable tag shape must be admitted deliberately.
        # The cube bucket has S3 versioning OFF, so a run on an image other than the one the dry run
        # validated is not recoverable.
        if [ "$DRY_RUN" != "true" ]; then
          case "$PIPELINE_IMAGE_VERSION" in
            v*|sha-*) ;;
            *)
              echo "REFUSING: image tag '$PIPELINE_IMAGE_VERSION' is not immutable and dry_run=false." >&2
              echo "Use a v<release> or sha-<commit> tag for a real run (see the manifest header)." >&2
              exit 1
              ;;
          esac
        fi
        args=(
          --stac-api-url "$STAC_API_URL"
          --cube-collection "$CUBE_COLLECTION"
          --bucket "$BUCKET"
          --s3-endpoint "$S3_ENDPOINT"
        )
        [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
        [ "$ROLLBACK" = "true" ] && args+=(--rollback)
        [ "$ALLOW_NO_BACKUP" = "true" ] && args+=(--allow-no-backup)
        [ "$REWRITE_ROOT_GEO" = "true" ] && args+=(--rewrite-root-geo)
        [ -n "$BACKUP_PREFIX" ] && args+=(--backup-prefix "$BACKUP_PREFIX")
        [ -n "$ITEM" ] && args+=(--item "$ITEM")
        [ -n "$SKIP_TILES" ] && args+=(--skip-tiles $SKIP_TILES)
        python /app/scripts/migrate_s1_rtc_datamodel.py "${args[@]}"
      resources:
        requests:
          # Per-slice streaming bounds peak memory; this is a starting request — Checkpoint A measures
          # real-tile peak RSS and right-sizes (plan OQ-2).
          memory: 8Gi
          cpu: "2"
      env:
      - name: PYTHONUNBUFFERED
        value: "1"
      - name: STAC_API_URL
        value: "{{workflow.parameters.stac_api_url}}"
      - name: CUBE_COLLECTION
        value: "{{workflow.parameters.cube_collection}}"
      - name: BUCKET
        value: "{{workflow.parameters.bucket}}"
      - name: S3_ENDPOINT
        value: "{{workflow.parameters.s3_endpoint}}"
      - name: DRY_RUN
        value: "{{workflow.parameters.dry_run}}"
      - name: PIPELINE_IMAGE_VERSION
        value: "{{workflow.parameters.pipeline_image_version}}"
      - name: ROLLBACK
        value: "{{workflow.parameters.rollback}}"
      - name: BACKUP_PREFIX
        value: "{{workflow.parameters.backup_prefix}}"
      - name: SKIP_TILES
        value: "{{workflow.parameters.skip_tiles}}"
      - name: ITEM
        value: "{{workflow.parameters.item}}"
      - name: ALLOW_NO_BACKUP
        value: "{{workflow.parameters.allow_no_backup}}"
      - name: REWRITE_ROOT_GEO
        value: "{{workflow.parameters.rewrite_root_geo}}"
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: geozarr-s3-credentials
            key: AWS_ACCESS_KEY_ID
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: geozarr-s3-credentials
            key: AWS_SECRET_ACCESS_KEY
      - name: AWS_ENDPOINT_URL
        value: "{{workflow.parameters.s3_endpoint}}"
      - name: AWS_DEFAULT_REGION
        value: "de"
